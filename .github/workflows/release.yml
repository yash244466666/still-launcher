name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading "v" (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$VERSION' is not a valid semantic version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not configured. See README > Release signing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build signed release APK
        shell: bash
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ github.run_number }}" \
            --no-daemon --console=plain

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/still-launcher-${VERSION}-release.apk"
          gzip -9 -c app/build/outputs/mapping/release/mapping.txt > "dist/mapping-${VERSION}.txt.gz"
          (cd dist && sha256sum ./*.apk ./*.txt.gz > SHA256SUMS)
          echo "--- SHA256SUMS ---"
          cat dist/SHA256SUMS
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "dist/still-launcher-${VERSION}-release.apk"
          else
            echo "::warning::apksigner not found; skipping signature verification"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Still Launcher v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## Install

            1. Download `still-launcher-${{ steps.version.outputs.version }}-release.apk` below.
            2. Allow installation from your browser or file manager when prompted.
            3. Open the app, complete onboarding, and set it as your home app from **Settings → Permissions**.

            The APK is signed and minified. Verify it with the attached `SHA256SUMS`:

            ```bash
            sha256sum -c SHA256SUMS
            ```

            Optional permissions are explained in the [README](https://github.com/yash244466666/still-launcher#permissions).
            For per-app grayscale, grant the secure-settings permission from a computer:

            ```bash
            adb shell pm grant org.stilllauncher android.permission.WRITE_SECURE_SETTINGS
            ```

            See [CHANGELOG.md](https://github.com/yash244466666/still-launcher/blob/main/CHANGELOG.md) for what changed.

          files: |
            dist/still-launcher-*-release.apk
            dist/SHA256SUMS
            dist/mapping-*.txt.gz

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 30

  fdroid:
    name: Update F-Droid repository
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/fdroid-repo.yml
    secrets: inherit
