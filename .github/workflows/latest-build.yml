name: Latest build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-build
  cancel-in-progress: true

jobs:
  publish:
    name: Publish rolling pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Prepare assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/still-launcher-latest.apk
          (cd dist && sha256sum still-launcher-latest.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Update rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Automated build from `${{ github.sha }}` on `${{ github.ref_name }}`.

            This is a debug-signed development build. For production installs use the latest tagged release.

            Install with:

            ```bash
            adb install -r still-launcher-latest.apk
            ```
          files: |
            dist/still-launcher-latest.apk
            dist/SHA256SUMS
